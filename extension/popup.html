<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email Tracker for Gmail</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --card: #ffffff;
        --ink: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --teal: #115e59;
        --teal-soft: #ccfbf1;
        --red: #9f1239;
        --red-bg: #fff1f2;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 360px;
        color: var(--ink);
        background: var(--bg);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }

      header {
        padding: 14px 14px 10px;
      }

      header p {
        margin: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--teal);
      }

      header h1 {
        margin: 4px 0 0;
        font-size: 16px;
        font-weight: 650;
      }

      .panel {
        margin: 0 14px 12px;
        padding: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }

      .url-row {
        display: flex;
        gap: 6px;
      }

      input[type="url"] {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }

      input[type="url"]:focus {
        outline: 2px solid rgba(17, 94, 89, 0.25);
        border-color: var(--teal);
      }

      button,
      .link-btn {
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-weight: 650;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .primary {
        padding: 8px 10px;
        background: var(--teal);
        color: #fff;
      }

      .ghost {
        padding: 8px 10px;
        background: #e7e5e4;
        color: var(--ink);
      }

      .row-actions {
        display: flex;
        gap: 6px;
        margin: 0 14px 14px;
      }

      .row-actions button,
      .row-actions a {
        flex: 1;
        text-align: center;
        text-decoration: none;
      }

      .link-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 10px;
        background: #fff;
        color: var(--teal);
        border: 1px solid var(--line);
      }

      h2 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 700;
      }

      .status {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }

      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .item {
        padding: 8px 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fafaf9;
      }

      .item-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
      }

      .subject {
        font-weight: 650;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recipient,
      .meta {
        color: var(--muted);
        font-size: 11px;
      }

      .badge {
        flex-shrink: 0;
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        background: #e7e5e4;
        color: #44403c;
      }

      .badge.opened {
        background: var(--teal-soft);
        color: var(--teal);
      }

      .empty,
      .error,
      .loading {
        padding: 14px 8px;
        text-align: center;
        color: var(--muted);
      }

      .error {
        color: var(--red);
        background: var(--red-bg);
        border-radius: 8px;
      }

      .spinner {
        width: 16px;
        height: 16px;
        margin: 0 auto 6px;
        border: 2px solid #d6d3d1;
        border-top-color: var(--teal);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .save-msg {
        margin: 6px 0 0;
        min-height: 16px;
        font-size: 11px;
        color: var(--teal);
      }

      .save-msg.error {
        padding: 0;
        background: none;
        color: var(--red);
      }
    </style>
  </head>
  <body>
    <header>
      <p>Gmail</p>
      <h1>Email Tracker</h1>
    </header>

    <section class="panel">
      <label for="api-url">Backend API URL</label>
      <div class="url-row">
        <input
          id="api-url"
          type="url"
          spellcheck="false"
          placeholder="http://localhost:3000"
        />
        <button id="save-url" class="primary" type="button">Save</button>
      </div>
      <p id="save-msg" class="save-msg" role="status"></p>
    </section>

    <section class="panel">
      <h2>
        Recent emails
        <span id="list-status" class="status"></span>
      </h2>
      <div id="email-list" class="list"></div>
    </section>

    <div class="row-actions">
      <button id="refresh" class="ghost" type="button">Refresh</button>
      <a id="dashboard-link" class="link-btn" href="http://localhost:3000" target="_blank" rel="noopener noreferrer">
        Open dashboard
      </a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
